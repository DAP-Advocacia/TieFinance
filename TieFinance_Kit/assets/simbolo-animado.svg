<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -80 496 429" role="img" aria-label="TieFinance"><style>.tf-stem,.tf-wing,.tf-fold{transform-box:fill-box;transform-origin:center;animation:tf-assemble 850ms cubic-bezier(.18,.8,.24,1) both}.tf-stem{--x:0px;--y:72px;--r:-9deg;animation-delay:120ms}.tf-wing{--x:-85px;--y:-24px;--r:-12deg;animation-delay:280ms}.tf-fold{--x:80px;--y:-45px;--r:12deg;animation-delay:470ms}@keyframes tf-assemble{from{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.92)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.tf-stem,.tf-wing,.tf-fold{animation:none!important;opacity:1;transform:none}}</style><defs><linearGradient id="tf-left" x1="0" y1=".8" x2="1" y2=".1"><stop stop-color="#b48022"/><stop offset=".48" stop-color="#f5bf50"/><stop offset=".78" stop-color="#fff3a4"/><stop offset="1" stop-color="#d4af37"/></linearGradient><linearGradient id="tf-fold" x1=".2" y1=".05" x2=".75" y2="1"><stop stop-color="#7d6210"/><stop offset=".28" stop-color="#94630f"/><stop offset=".57" stop-color="#dba83d"/><stop offset="1" stop-color="#f4d068"/></linearGradient><linearGradient id="tf-shine" x1=".75" y1="0" x2=".18" y2="1"><stop stop-color="#8a5c10"/><stop offset=".5" stop-color="#c58c26"/><stop offset="1" stop-color="#ffe38d"/></linearGradient><linearGradient id="tf-stem1" x1=".1" y1="0" x2=".75" y2="1"><stop stop-color="#79500c"/><stop offset=".45" stop-color="#c18b2b"/><stop offset=".84" stop-color="#e5b04b"/><stop offset="1" stop-color="#ab7520"/></linearGradient><linearGradient id="tf-stem2" x1=".1" y1="0" x2=".65" y2="1"><stop stop-color="#78500a"/><stop offset=".5" stop-color="#c48b27"/><stop offset="1" stop-color="#ffe18a"/></linearGradient></defs><g class="tf-stem"><path d="M97 142 140 114 140 237 97 269Z" fill="url(#tf-stem1)"/><path d="M140 114 183 85 183 206 140 237Z" fill="url(#tf-stem2)"/><path d="M140 120V237" stroke="#f4d068" stroke-opacity=".55" stroke-width=".8"/></g><g class="tf-wing"><path d="M0 64 64 0H225L112 64Z" fill="url(#tf-left)"/><path d="M0 64 64 0H225" fill="none" stroke="#f4d068" stroke-width=".65"/></g><g class="tf-fold"><path d="M225 0H296L226 64H218L97 144V72Z" fill="url(#tf-fold)"/><path d="M225 0H296L226 64H218L140 116C145 79 162 39 190 20Z" fill="url(#tf-shine)"/><path d="M97 72 225 0" fill="none" stroke="#fff0b1" stroke-width=".9" stroke-opacity=".8"/></g></svg>