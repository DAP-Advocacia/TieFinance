function render(){let [sub,action]=headers[page],body=page==='Dashboard'?dashboard():page==='Contas a pagar'?titlePage('out'):page==='Contas a receber'?titlePage('in'):layouts[page]();$('content').innerHTML=`<div class="breadcrumb">ERP Finance / ${esc(page)}</div><div class="pagehead"><div><h1>${esc(page)}</h1><p>${sub}</p></div><div class="actions"><button class="primary" id="action">${action.startsWith('Novo')||action.startsWith('Nova')?'+ ':''}${action}</button></div></div>${company===1?'<div class="notice">Empresa alternativa selecionada apenas para simular a navegação. Os valores de exemplo permanecem iguais.</div>':''}${body}<div class="foot"><span>ERP Finance · Proposta de layout v0.2</span><span>Todos os dados são fictícios · Sem conexão à API</span></div>`;document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('action').onclick=()=>showModal(action);if($('search')){$('search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)};$('status').onchange=e=>{status=e.target.value;render()}}}
function showModal(action){let entry=['Dashboard','Contas a pagar','Contas a receber'].includes(page);$('modalBody').innerHTML=`<h2>${esc(action)}</h2><p>Prévia visual de interação. Nenhum dado será gravado ou enviado.</p>${entry?`<div class="formgrid"><label class="wide">Descrição<input placeholder="Ex.: Prestação de serviços"></label><label>Tipo<select><option ${page!=='Contas a pagar'?'selected':''}>Receita</option><option ${page==='Contas a pagar'?'selected':''}>Despesa</option></select></label><label>Valor (R$)<input type="number" min="0.01" step="0.01" placeholder="0,00"></label><label>Competência<input type="month"></label><label>Vencimento<input type="date"></label><label>Cliente / fornecedor<select><option>Selecionar parceiro</option><option>Cliente Alpha</option><option>Fornecedor Beta</option></select></label><label>Centro de custos<select><option>Selecionar centro</option><option>Operacional</option><option>Administrativo</option></select></label><label class="wide">Plano de contas<select><option>Selecionar conta</option><option>Receitas de serviços</option><option>Despesas administrativas</option></select></label></div>`:`<div class="notice">Esta ação representa um ponto de entrada previsto para o módulo. O fluxo funcional será desenvolvido e integrado ao ERP em versão posterior.</div>`}<button class="secondary" id="dismiss">Fechar prévia</button>`;$('dismiss').onclick=()=>$('dialog').close();$('dialog').showModal()}
$('nav').innerHTML=groups.map(([g,ns])=>`<div class="group">${g}</div>${ns.map(([n,i])=>`<button class="nav" data-page="${n}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg>${n}</button>`).join('')}`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;status='Todos';query='';document.body.classList.remove('menu-open');render();window.scrollTo(0,0)});$('company').onchange=e=>{company=e.target.selectedIndex;render()};$('menuBtn').onclick=()=>document.body.classList.toggle('menu-open');$('overlay').onclick=()=>document.body.classList.remove('menu-open');$('close').onclick=()=>$('dialog').close();render();
