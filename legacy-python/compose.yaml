services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://erp:${DB_PASSWORD}@db:5432/erp
      ERP_ADMIN_EMAIL: ${ERP_ADMIN_EMAIL}
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD}
    volumes: ["uploads:/srv/data"]
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: erp
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
  uploads:
